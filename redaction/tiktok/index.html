<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Pouls – Connecter TikTok</title><link rel="stylesheet" href="../legal/style.css"></head>
<body><main>
<div class="marque"><img src="../logo.png" alt="">LE POULS</div>
<h1>Connecter le compte TikTok</h1>
<p>Colle la <b>Client key</b> de l'application TikTok (elle n'est pas secrète), puis connecte-toi avec le compte TikTok du Pouls.</p>
<input id="cle" placeholder="Client key" style="width:100%;padding:12px;font-size:16px;border:2px solid #1A3A35;border-radius:10px;box-sizing:border-box">
<button id="go">Se connecter à TikTok</button>
<script>
const redirect = "https://jeremydeb64.github.io/le-pouls-videos/tiktok/callback.html";
document.getElementById("go").onclick = () => {
  const k = document.getElementById("cle").value.trim();
  if (!k) return;
  const u = new URL("https://www.tiktok.com/v2/auth/authorize/");
  u.search = new URLSearchParams({ client_key: k, scope: "user.info.basic,video.upload", response_type: "code", redirect_uri: redirect, state: Math.random().toString(36).slice(2) });
  location.href = u.toString();
};
</script>
</main></body></html>
