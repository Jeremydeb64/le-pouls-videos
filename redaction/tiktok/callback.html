<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Pouls – Connexion TikTok</title><link rel="stylesheet" href="../legal/style.css"></head>
<body><main>
<div class="marque"><img src="../logo.png" alt="">LE POULS</div>
<h1 id="titre">Connexion TikTok</h1>
<div id="contenu"></div>
<script>
const q = new URLSearchParams(location.search);
const code = q.get("code"), erreur = q.get("error");
const lien = "https://github.com/Jeremydeb64/le-pouls-videos/actions/workflows/tiktok-connexion.yml";
const c = document.getElementById("contenu");
if (code) {
  c.innerHTML = `<p>TikTok a donné son accord. Il reste une étape (dans les 5 minutes) :</p>
  <ol><li>Copie ce code :</li></ol><div class="code" id="code"></div><button id="copier">Copier le code</button>
  <ol start="2"><li>Ouvre <a href="${lien}" target="_blank">GitHub › Actions › Connexion TikTok</a>, clique <b>Run workflow</b>, colle le code et lance.</li></ol>`;
  document.getElementById("code").textContent = code;
  document.getElementById("copier").onclick = () => navigator.clipboard.writeText(code).then(() => (document.getElementById("copier").textContent = "Copié ✓"));
} else {
  document.getElementById("titre").textContent = "Connexion non aboutie";
  c.innerHTML = `<p>TikTok n'a pas transmis d'autorisation${erreur ? ` (${erreur})` : ""}. Relance la connexion depuis le lien fourni.</p>`;
}
</script>
</main></body></html>
