<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Pouls, la rédaction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter+Tight:wght@500;700;800&display=swap">
<style>
:root{--paper:#EFEBE3;--ink:#15171A;--green:#1E5B4F;--greenDark:#16463D;--muted:#6B6860;--line:#D8D2C5;--white:#FBFAF7;--red:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 28px 8px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:10px}
.logo .sl{font-weight:800;font-size:34px;color:var(--green);letter-spacing:-3px}
.logo .nom{font-family:Fraunces,serif;font-weight:900;font-size:30px}
.logo .sous{font-weight:700;font-size:15px;color:var(--muted);margin-left:6px}
.etat{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.pastille{width:12px;height:12px;border-radius:6px;background:var(--muted)}
.etat.live .pastille{background:#2FA37C;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.demo{background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.5px}
main{padding:0 28px 28px;max-width:1240px;margin:0 auto}
.scene{position:relative;width:100%;border-radius:18px;overflow:hidden;border:3px solid var(--ink);background:var(--paper)}
.scene svg{display:block;width:100%;height:auto}
.bulle{position:absolute;transform:translate(-50%,-100%);max-width:23%;background:var(--white);border:2.5px solid var(--ink);border-radius:14px;padding:9px 12px;font-size:clamp(10px,1.15vw,14px);font-weight:700;line-height:1.3;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;box-shadow:0 3px 0 var(--ink)}
.bulle.on{opacity:1;transform:translate(-50%,-108%)}
.bulle::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:var(--white);border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.grille{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;margin-top:22px}
@media (max-width:820px){.grille{grid-template-columns:1fr}.bulle{max-width:40%}}
h2{font-family:Fraunces,serif;font-weight:900;font-size:24px;margin:0 0 12px}
.fil{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
.fil li{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:10px 0;border-bottom:2px solid var(--line);font-size:14.5px;line-height:1.35}
.qui{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--green)}
.qui.systeme{color:var(--muted)}
.heure{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:0;text-transform:none}
.carte{border:2.5px solid var(--ink);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--white)}
.carte .t{font-family:Fraunces,serif;font-weight:700;font-size:18px;line-height:1.2}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:12px;margin-top:8px;background:var(--line)}
.badge.a_valider{background:var(--green);color:var(--paper)}
.badge.bloque{background:var(--red);color:#fff}
.badge.publie{background:var(--ink);color:var(--paper)}
.liens{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px;font-weight:700}
.liens a{color:var(--green)}
.vide{color:var(--muted);font-size:14px}
/* Personnages */
.agent .corps{transform-box:fill-box;transform-origin:bottom center}
.agent.travaille .corps{animation:bob .9s ease-in-out infinite}
.agent.travaille .bras{animation:tape .25s steps(2) infinite}
.agent.travaille .ecran{animation:lueur 1.4s ease-in-out infinite}
.agent.travaille .loupe{animation:loupe 2.2s ease-in-out infinite}
.agent.travaille .tel{animation:lueur .9s ease-in-out infinite}
.agent.travaille .page{animation:page 1.8s ease-in-out infinite}
.agent.attend .corps{opacity:.62}
.agent .zz{opacity:0}
.agent.attend .zz{opacity:1;animation:zz 2.4s ease-in-out infinite}
.agent .ok,.agent .stop{opacity:0;transition:opacity .3s}
.agent.termine .ok{opacity:1}
.agent.bloque .stop{opacity:1}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes tape{0%{transform:translateY(0)}100%{transform:translateY(-3px)}}
@keyframes lueur{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes loupe{0%,100%{transform:translate(0,0)}33%{transform:translate(-18px,-10px)}66%{transform:translate(10px,-18px)}}
@keyframes page{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes zz{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
.loupe,.page{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
// Source de l'état en direct : le script Google « Le Pouls Drive » (lecture publique, sans secret)
const URL_ETAT = "https://script.google.com/macros/s/AKfycbw_kNNMFTU7mo957ry6olWuJwdbuEmS-RGPOQ8mz25TTNxdM9AcEb38Q9DYwGDy2pfiLQ/exec";
const AGENTS = ["veilleur", "scenariste", "controleur", "diffuseur"];
const NOMS = { veilleur: "Veilleur", scenariste: "Scénariste", controleur: "Contrôleur", diffuseur: "Diffuseur", systeme: "Système" };
const ETATS_VIDEO = { a_valider: "À valider", bloque: "Bloquée", publie: "Publiée" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const heure = (t) => { try { return new Date(t).toLocaleTimeString("fr-CH", { hour: "2-digit", minute: "2-digit" }); } catch { return ""; } };

let derniers = {};
function afficher(s, demo) {
  const enCours = s.maj && Date.now() - new Date(s.maj).getTime() < 3 * 60 * 1000 && Object.values(s.agents || {}).includes("travaille");
  const etat = document.getElementById("etat");
  etat.classList.toggle("live", !!enCours || demo);
  document.getElementById("etat-txt").textContent = demo
    ? "Démonstration"
    : enCours ? `Édition du ${s.edition || ""} en cours` : s.maj ? `En pause, dernière activité à ${heure(s.maj)}` : "En pause";
  document.getElementById("demo").hidden = !demo;

  for (const a of AGENTS) {
    const g = document.getElementById("a-" + a);
    g.setAttribute("class", "agent " + ((s.agents || {})[a] || "attend"));
  }
  // Bulle : dernier message de chaque agent, affiché s'il est récent dans le fil
  const msgs = s.messages || [];
  const recents = msgs.slice(-4);
  for (const a of AGENTS) {
    const b = document.getElementById("b-" + a);
    const m = [...recents].reverse().find((x) => x.agent === a);
    if (m) {
      if (derniers[a] !== m.t) { b.classList.remove("on"); void b.offsetWidth; derniers[a] = m.t; }
      b.textContent = m.texte.length > 150 ? m.texte.slice(0, 147) + "…" : m.texte;
      b.classList.add("on");
    } else b.classList.remove("on");
  }
  const fil = document.getElementById("fil");
  fil.innerHTML = msgs.length
    ? [...msgs].reverse().map((m) => `<li><span class="qui ${m.agent === "systeme" ? "systeme" : ""}">${esc(NOMS[m.agent] || m.agent)}<span class="heure">${heure(m.t)}</span></span><span>${esc(m.texte)}</span></li>`).join("")
    : '<li class="vide">Aucun échange pour l\'instant.</li>';
  const eps = (s.episodes || []).slice().reverse();
  document.getElementById("videos").innerHTML = eps.length
    ? eps.map((e) => `<div class="carte"><div class="t">${esc(e.titre || e.id)}</div><span class="badge ${esc(e.etat)}">${esc(ETATS_VIDEO[e.etat] || e.etat || "")}</span>
        <div class="liens">${e.lien_video ? `<a href="${esc(e.lien_video)}">▶ Voir la vidéo</a>` : ""}${e.lien_drive ? `<a href="${esc(e.lien_drive)}">📁 Drive</a>` : ""}${e.lien_issue ? `<a href="${esc(e.lien_issue)}">✓ Valider</a>` : ""}</div></div>`).join("")
    : '<p class="vide">Aucune vidéo pour l\'instant.</p>';
}

// ---- Démonstration (quand l'état en direct n'est pas joignable, ou avec #demo) ----
const SCENARIO = [
  ["veilleur", "travaille", "Édition du soir, je fais le tour des sources."],
  ["veilleur", "travaille", "J'ai trois papiers sur le même sujet, je garde celui du Nouvelliste."],
  ["veilleur", "termine", "Je garde « Salaire minimum : le vote du 29 novembre »."],
  ["scenariste", "travaille", "Je lis l'article et je cherche la source officielle du Canton."],
  ["scenariste", "travaille", "Script prêt : 1 min 05, le oui et le non à égalité."],
  ["controleur", "travaille", "Je vérifie les chiffres : 22 francs, 15'000 salariés, OK."],
  ["controleur", "travaille", "Carte 3 trop longue, tu raccourcis ?"],
  ["scenariste", "travaille", "C'est fait, j'envoie le texte à Lucie."],
  ["scenariste", "termine", "Montage lancé."],
  ["controleur", "termine", "Images clés OK, rien ne déborde. Feu vert."],
  ["diffuseur", "travaille", "Dossier de publication déposé sur le Drive."],
  ["diffuseur", "attend", "Vidéo prête, j'attends le feu vert de Jérémy."],
];
let demoTimer = null;
function demarrerDemo() {
  if (demoTimer) return;
  let i = 0;
  const s = { edition: "soir", agents: { veilleur: "attend", scenariste: "attend", controleur: "attend", diffuseur: "attend" }, messages: [], episodes: [], maj: new Date().toISOString() };
  const pas = () => {
    if (i >= SCENARIO.length) {
      s.episodes = [{ id: "demo", titre: "Salaire minimum : le vote du 29 novembre", etat: "a_valider" }];
      afficher(s, true);
      setTimeout(() => { i = 0; s.messages = []; s.episodes = []; for (const a of AGENTS) s.agents[a] = "attend"; }, 6000);
      demoTimer = setTimeout(pas, 7000);
      return;
    }
    const [a, etat, texte] = SCENARIO[i++];
    for (const x of AGENTS) if (x !== a && s.agents[x] === "travaille") s.agents[x] = "termine";
    s.agents[a] = etat;
    s.messages.push({ agent: a, texte, t: new Date().toISOString() });
    s.maj = new Date().toISOString();
    afficher(s, true);
    demoTimer = setTimeout(pas, 2600);
  };
  pas();
}

async function rafraichir() {
  if (location.hash === "#demo") return demarrerDemo();
  try {
    const r = await fetch(URL_ETAT, { cache: "no-store" });
    const s = await r.json();
    if (!s || !s.messages) throw new Error("vide");
    if (demoTimer) { clearTimeout(demoTimer); demoTimer = null; }
    afficher(s, false);
  } catch (e) {
    demarrerDemo();
  }
}

function horloge() {
  const d = new Date();
  const m = d.getMinutes(), h = d.getHours() % 12 + m / 60;
  document.getElementById("aig-m").setAttribute("transform", `rotate(${m * 6})`);
  document.getElementById("aig-h").setAttribute("transform", `rotate(${h * 30})`);
}
horloge(); setInterval(horloge, 20000);
rafraichir(); setInterval(rafraichir, 10000);
</script>
