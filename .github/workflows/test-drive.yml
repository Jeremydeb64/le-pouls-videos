name: Test dépôt Drive

on:
  push:
    paths:
      - ".github/test-drive.json"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test de l'état en direct (mini rédaction)
        env:
          DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
        run: |
          node --input-type=module -e '
          const URL = "https://script.google.com/macros/s/AKfycby0pxEgRNfRiB09clLAMNDSJUUPMZ4oj5aZ7i3QP7IIYjH5V7lQMlgulkvTkx7tESi-Kg/exec";
          const statut = { edition: "test", agents: { veilleur: "termine", scenariste: "attend", controleur: "attend", diffuseur: "attend" }, messages: [{ agent: "veilleur", texte: "Test de connexion : la rédaction est en ligne.", t: new Date().toISOString() }], episodes: [], maj: new Date().toISOString() };
          const r = await fetch(URL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ secret: process.env.DRIVE_SECRET.trim(), action: "statut", statut }) });
          console.log("Envoi :", await r.text());
          const g = await fetch(URL);
          console.log("Lecture :", (await g.text()).slice(0, 300));
          '
      - name: Envoi d'un dossier de test vers Drive
        if: false
        env:
          DRIVE_WEBAPP_URL: ${{ secrets.DRIVE_WEBAPP_URL }}
          DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          import { driveActif, deposerSurDrive } from "./pipeline/lib/drive.mjs";
          const t = JSON.parse(fs.readFileSync(".github/test-drive.json", "utf8"));
          if (!driveActif()) { console.log("Secrets Drive absents"); process.exit(1); }
          const lien = await deposerSurDrive(t.nom, t.fichiers);
          console.log("OK Drive :", lien);
          '
