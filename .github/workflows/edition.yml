name: Édition Le Pouls

on:
  schedule:
    # GitHub retarde parfois les tâches planifiées de plusieurs heures : plusieurs essais par édition,
    # le premier qui démarre fait l'édition, les suivants s'arrêtent (voir pipeline/edition.mjs)
    - cron: "7 13 * * *"  # édition du jour : 14 h en hiver (15 h en été), heure de Zurich
    - cron: "37 13 * * *"
    - cron: "17 14 * * *"
  push:
    paths:
      - ".github/lancer-edition.json"   # permet de lancer une édition en poussant ce fichier
  workflow_dispatch:
    inputs:
      edition:
        description: "jour (par défaut), matin ou soir"
        default: "jour"
      max_sujets:
        description: "Nombre de vidéos (1 à 3)"
        default: "1"

permissions:
  contents: write
  issues: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx remotion browser ensure
      - name: Veilleur → Scénariste → Voix → Rendu → Contrôleur
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || vars.ANTHROPIC_API_KEY }}
          # Visuels IA désactivés (pas de solde API Higgsfield). Pour réactiver : HIGGSFIELD_KEY: ${{ secrets.HIGGSFIELD_POULS_2 }}
          ELEVENLABS_API_KEY: ${{ secrets.KEYS_ELEVEN_POULS || vars.KEYS_ELEVEN_POULS || secrets.ELEVENLABS_API_KEY }}
          DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
          EDITION_DEMANDEE: ${{ github.event.inputs.edition }}
          MAX_DEMANDE: ${{ github.event.inputs.max_sujets }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            EDITION=$(node -p "require('./.github/lancer-edition.json').edition")
            MAX_SUJETS=$(node -p "require('./.github/lancer-edition.json').max_sujets")
            VEILLE_SEULE=$(node -p "require('./.github/lancer-edition.json').veille_seule ? '1' : ''"); export VEILLE_SEULE
            SUJET=$(node -p "JSON.stringify(require('./.github/lancer-edition.json').sujet || '')" | sed 's/^""$//'); export SUJET
          elif [ -n "$EDITION_DEMANDEE" ]; then
            EDITION=$EDITION_DEMANDEE; MAX_SUJETS=${MAX_DEMANDE:-1}
          else
            EDITION=jour; MAX_SUJETS=1
          fi
          export EDITION MAX_SUJETS
          node pipeline/edition.mjs
      - name: Demande de validation (release + issue par vidéo)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
        run: node pipeline/validation.mjs
      - name: Archive (état de la rédaction et épisodes)
        if: always()
        run: |
          git config user.name "Le Pouls"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- package-lock.json 2>/dev/null || true
          for d in state episodes publications; do [ -e "$d" ] && git add "$d"; done
          git commit -m "Édition ${{ github.run_number }} : état de la rédaction" || echo "Rien à archiver"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 15; done
